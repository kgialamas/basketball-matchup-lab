name: Refresh Current Site Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build fresh current-season database
        run: |
          rm -f db/basketball.db
          python -m scripts.sync --season U2026 --season E2026

      - name: Export static site dataset
        run: python -m scripts.export_site_data

      - name: Show dataset size
        run: |
          ls -lh docs/data/site-data.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/site-data.json').read_text())
          for s in d['seasons']:
              print(s['competition'], s['season'], len(s['teams']), 'teams', sum(len(t['players']) for t in s['teams']), 'player-team rows')
          PY

      - name: Commit refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/site-data.json
          if git diff --cached --quiet; then
            echo "No site data changes"
          else
            git commit -m "Refresh current basketball site data"
            git push
          fi
